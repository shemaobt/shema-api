name: Joãozinho Review

# Fires when @joaocarvoli is requested as a reviewer. All logic and the review
# spec live in shemaobt/.github — edit there, not here.

on:
  pull_request:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: joaozinho-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  joaozinho:
    uses: shemaobt/.github/.github/workflows/joaozinho-review.yml@main
    with:
      lens_pack: python-fastapi
      # Named rather than left to the reusable workflow's default, because
      # `request-joaozinho-on-dev.yml` requests this same login and the two have to
      # agree: a request for anyone else fires this workflow and skips it.
      reviewer_login: joaocarvoli
      # A pull request into `dev` merges with no human approval, so there the bot may
      # request changes. It blocks through that review and never through this check:
      # a requested change is a successful run, so `joaozinho / review` is green
      # either way, and `dev` keeps `required_pull_request_reviews` at zero approvals
      # so that the review still holds the merge. Into `main` a person approves and
      # the bot stays advisory: see docs/adr/0001-staging-environment.md.
      verdict_mode: ${{ github.base_ref == 'dev' && 'block' || 'comment' }}
      # The reusable workflow's default of 30 ran out on a 23-file pull request (#667):
      # the run ended in error_max_turns and the bot published nothing.
      max_turns: 60
      app_id: ${{ vars.JOAOZINHO_APP_ID }}
    secrets:
      app_private_key: ${{ secrets.JOAOZINHO_APP_PRIVATE_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
