name: Lint

on:
  pull_request:

env:
  # Opt JavaScript-based actions into Node.js 24 ahead of the 2026-06-02
  # forced switch. Remove once the runner default is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

  # `ruff` and `mypy` read the source without running it, and `test` runs it through a suite
  # whose collection order can break an import cycle by accident — nine branches of one stack
  # were green together while one of them could not boot. This asks the only question a server
  # asks, in a clean interpreter, and answers it in seconds rather than in the ten minutes the
  # suite takes to reach the same import.
  boots:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./boot-check.db
      JWT_SECRET_KEY: test-secret-for-ci-only
      INNGEST_DEV: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: The application imports in a clean interpreter
        run: uv run python -c "import app.main"

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run mypy
        run: uv run mypy app/
