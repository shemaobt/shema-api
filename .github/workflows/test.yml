name: Test

on:
  pull_request:

  # `integration/**` is the base every new slice is cut from, and it has no pull request of
  # its own, so until ENG-554 nothing here ever ran on it: it sat red on `ruff format` and
  # was fixed by whoever branched off it next. A gate protects by being in the ancestor,
  # not by being good.
  #
  # The filter stays this narrow on purpose. The test job costs between 6 and 56 minutes
  # (ENG-556) and the chain is merged a step at a time, so every branch widened here is
  # paid once per step.
  push:
    branches:
      - 'integration/**'

env:
  # Opt JavaScript-based actions into Node.js 24 ahead of the 2026-06-02
  # forced switch. Remove once the runner default is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The suite measures the length of a recording with ffprobe, the same tool
      # `oral_collector/split_service.py` and `inngest/audio_splitting.py` already shell out
      # to and the same one both Dockerfiles install. The runner image ships neither, so
      # without this the tests here would be measuring a machine the deployed one is not.
      # 16 s on the runner (measured on this job; a local ubuntu 24.04 container took 43 s,
      # so the runner's mirror is the difference — the number to trust is the runner's).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          JWT_SECRET_KEY: test-secret-for-pytest-only
          DATABASE_URL: sqlite+aiosqlite:///./test.db
