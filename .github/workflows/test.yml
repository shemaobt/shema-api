name: Test

on:
  pull_request:

  # See the note in `lint.yml` for why `integration/**` is here at all.
  #
  # The narrowness of the filter is this file's own concern more than any other's: this job
  # is the one measured between 6 and 56 minutes (ENG-556), and the chain is merged a step
  # at a time, so every branch added here is paid once per step by the slowest job there is.
  push:
    branches:
      - 'integration/**'

env:
  # Opt JavaScript-based actions into Node.js 24 ahead of the 2026-06-02
  # forced switch. Remove once the runner default is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    # Twice the five minutes the `Run tests` step is held to (ENG-969). Without this the
    # job inherits GitHub's 360-minute default, which is how one hung run stayed "pending"
    # for six hours instead of turning red (ENG-913).
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The suite measures the length of a recording with ffprobe, the same tool
      # `oral_collector/split_service.py` and `inngest/audio_splitting.py` already shell out
      # to and the same one both Dockerfiles install. The runner image ships neither, so
      # without this the tests here would be measuring a machine the deployed one is not.
      # 16 s on the runner (measured on this job; a local ubuntu 24.04 container took 43 s,
      # so the runner's mirror is the difference — the number to trust is the runner's).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group dev

      # Four processes, split by file: the schema is created once per process and a module's
      # cases share it in file order, which `--dist loadfile` is what holds. `-v` is gone —
      # four workers interleaving 3259 lines is not a readable log — and `-rfE` keeps every
      # failure and error listed at the end, where a reader looks first.
      - name: Run tests
        run: uv run pytest tests/ -n 4 --dist loadfile -rfE
        env:
          JWT_SECRET_KEY: test-secret-for-pytest-only
