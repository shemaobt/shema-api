name: Checks

on:
  pull_request:

  # `integration/**` is the base every new slice is cut from, and it has no pull request of
  # its own, so until ENG-554 nothing here ever ran on it: it sat red on `ruff format` and
  # was fixed by whoever branched off it next. A gate protects by being in the ancestor,
  # not by being good.
  #
  # The filter stays this narrow on purpose. The test job costs between 6 and 56 minutes
  # (ENG-556) and the chain is merged a step at a time, so every branch widened here is
  # paid once per step.
  push:
    branches:
      - 'integration/**'

env:
  # Opt JavaScript-based actions into Node.js 24 ahead of the 2026-06-02
  # forced switch. Remove once the runner default is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Four checks in a queue, in one job. They were three jobs, each repeating the same four
  # setup steps for well under a minute of work between them (ENG-969), and a pull request
  # carried three lines for it. The clock was never the cost; the list was. The first failure
  # stops the queue. On `main` this job runs seven commands; here it runs the four this
  # branch has — the doctrine guard and the canon drift check have no job on this branch, and
  # the promotion did not invent them.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Twice what the four commands measure between them, and without inheriting GitHub's
    # 360-minute default, which is how a hung job stayed "pending" for six hours instead of
    # turning red (ENG-913).
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      # `ruff` and `mypy` read the source without running it, and `test` runs it through a
      # suite whose collection order can break an import cycle by accident. Nine branches of
      # one stack were green together while one of them could not boot, and the green was not
      # luck — it was order: that branch's role-gate suite errored on its own and passed
      # inside the full run.
      #
      # It lives here, on the junction, and not on the slice that found it. A gate protects by
      # being in the ancestor, not by being good: the role gate ENG-438 added only ever guarded
      # routes whose branch had ENG-438 behind them, which is why later ones were born open.
      # The same shape, twice. From here this one reaches every line that joins.
      - name: The application imports in a clean interpreter
        env:
          DATABASE_URL: sqlite+aiosqlite:///./boot-check.db
          JWT_SECRET_KEY: test-secret-for-ci-only
          INNGEST_DEV: "1"
        run: uv run python -c "import app.main"

      - name: Run mypy
        run: uv run mypy app/

      # The file that opens a fresh interpreter to prove what the suite's own process cannot
      # prove about itself: that the application boots. It belongs beside the boot import
      # above, which already pays for a clean interpreter as one of this job's commands
      # (ENG-980). `main` sends three files here; this branch has one of the three.
      - name: Run the tests that open a fresh interpreter
        env:
          JWT_SECRET_KEY: test-secret-for-ci-only
        run: uv run pytest tests/ -rfE -m fresh_interpreter
